title: Moving in
sectionLabel: SLY FOX SECTION, UNIT 1
# The words are unchanged -- rooms, surfaces and the things you put in them.
# What changed is who the sentences are about.
#
# The cast is three names and nothing else, introduced once each in puck 1 and
# then reused everywhere, including puck 3, where they are the only thing
# carried over (a name is not vocabulary, so it does not break puck 3's rule
# against using this unit's words):
#
#   Маріо   -- the older brother. Red, practical, owns the only mirror.
#   Луїджі  -- the younger. Green, sleeps on the sofa, will not sleep in the
#              dark. Unit 2 is his.
#   Йоші    -- the cat. Sleeps on whatever is newest, is under everything.
#
# All three are indeclinable in Ukrainian, which is why they are these three
# and not Боузер: an indeclinable name can stand in any slot in any sentence
# without introducing a case form that has to be taught.
#
# The other seam is the household's own week -- no meat on Wednesday, nothing
# to do on Sunday, somebody singing in a choir. Those sentences are built
# entirely out of the Duolingo export (середа, м'ясо, риба, неділя, хор,
# співати), so the theme costs the unit no vocabulary at all.
pucks:
  # Puck 1 and 2 teach. Lessons 1-3 introduce; lesson 4 introduces nothing and
  # is the same words asked harder.
  - kind: skill
    label: The empty flat
    art: star
    lessons:
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: двері
            choices: [door, window, wall]
            answers: [door]
            hints: {двері: [door, the door, doors]}
            word: двері
            newWords: [двері]
          - type: translate
            direction: [uk, en]
            prompt: Двері зелені.
            bank: [The, door, is, green, red, wall, white]
            answers:
              - The door is green
              - The doors are green
            hints: {двері: [door, the door], зелені: [green]}
            word: двері
          - type: assist
            direction: [uk, en]
            prompt: стіна
            choices: [wall, floor, door]
            answers: [wall]
            hints: {стіна: [wall, a wall]}
            word: стіна
            newWords: [стіна]
          - type: translate
            direction: [en, uk]
            prompt: The wall is red
            bank: [Стіна, червона, зелена, двері, нова]
            answers:
              - Стіна червона
            hints: {wall: [стіна], red: [червона]}
            word: стіна
          - type: listenTap
            direction: [uk, uk]
            audio: Стіна червона, а двері зелені.
            bank: [Стіна, червона, а, двері, зелені, біла]
            answers:
              - Стіна червона, а двері зелені
            meaning: The wall is red, and the door is green
            word: двері
          # Маріо arrives here and stays for two units. A name is a new word
          # exactly once, and costs nothing to learn, which is why one can
          # ride along in a lesson that is already teaching two.
          - type: translate
            direction: [uk, en]
            prompt: Маріо, де двері?
            bank: [Mario, where, is, the, door, wall, window]
            answers:
              - Mario, where is the door?
            hints: {маріо: [Mario], де: [where], двері: [door, the door]}
            word: двері
            newWords: [Маріо]
          - type: translate
            direction: [en, uk]
            prompt: The wall in my room is white
            bank: [Стіна, у, моїй, кімнаті, біла, зелена, двері]
            answers:
              - Стіна у моїй кімнаті біла
              - У моїй кімнаті стіна біла
            hints: {wall: [стіна], my: [моїй], room: [кімнаті], white: [біла]}
            word: стіна
          - type: translate
            direction: [uk, en]
            prompt: У новій квартирі є двері, вікно і стіна.
            bank: [In, the, new, flat, there, is, a, a, a, door, window, and, wall, floor]
            answers:
              - In the new flat there is a door, a window and a wall
            hints: {новій: [new], квартирі: [flat, apartment], двері: [door], вікно: [window], стіна: [wall]}
            word: двері
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: підлога
            choices: [floor, wall, door]
            answers: [floor]
            hints: {підлога: [floor, the floor]}
            word: підлога
            newWords: [підлога]
          - type: translate
            direction: [uk, en]
            prompt: Підлога холодна.
            bank: [The, floor, is, cold, warm, wall, white]
            answers:
              - The floor is cold
            hints: {підлога: [floor], холодна: [cold]}
            word: підлога
          - type: assist
            direction: [uk, en]
            prompt: ванна
            choices: [bathroom, bedroom, kitchen]
            answers: [bathroom]
            hints: {ванна: [bathroom, a bathroom]}
            word: ванна
            newWords: [ванна]
          - type: translate
            direction: [en, uk]
            prompt: Luigi, where is the bathroom
            bank: [Луїджі, де, ванна, підлога, тут, кімната]
            answers:
              - Луїджі, де ванна
            hints: {luigi: [Луїджі], where: [де], bathroom: [ванна]}
            word: ванна
            newWords: [Луїджі]
          - type: match
            direction: [uk, en]
            pairs:
              - target: підлога
                source: floor
              - target: ванна
                source: bathroom
              - target: двері
                source: door
              - target: стіна
                source: wall
              - target: кімната
                source: room
          - type: listenTap
            direction: [uk, uk]
            audio: Ванна маленька, а кімната велика.
            bank: [Ванна, маленька, а, кімната, велика, холодна]
            answers:
              - Ванна маленька, а кімната велика
            meaning: The bathroom is small, and the room is big
            word: ванна
          - type: translate
            direction: [uk, en]
            prompt: Луїджі спить на підлозі.
            bank: [Luigi, is, sleeping, on, the, floor, wall, bed]
            answers:
              - Luigi is sleeping on the floor
              - Luigi sleeps on the floor
            hints: {луїджі: [Luigi], спить: [sleeps, is sleeping], підлозі: [floor, the floor]}
            word: підлога
            newWords: [підлозі]
          - type: translate
            direction: [en, uk]
            prompt: The floor in the bathroom is cold
            bank: [Підлога, у, ванній, холодна, тепла, кухні, стіна]
            answers:
              - Підлога у ванній холодна
              - У ванній підлога холодна
            hints: {floor: [підлога], bathroom: [ванній], cold: [холодна]}
            word: ванна
            newWords: [ванній]
          - type: translate
            direction: [en, uk]
            prompt: Mario, I do not want to sleep on the floor
            bank: [Маріо, я, не, хочу, спати, на, підлозі, ліжку]
            answers:
              - Маріо, я не хочу спати на підлозі
            hints: {mario: [Маріо], not: [не], want: [хочу], sleep: [спати], floor: [підлозі]}
            word: підлога
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: ліжко
            choices: [bed, sofa, floor]
            answers: [bed]
            hints: {ліжко: [bed, a bed]}
            word: ліжко
            newWords: [ліжко]
          - type: translate
            direction: [uk, en]
            prompt: Йоші любить моє ліжко.
            bank: [Yoshi, likes, my, bed, sofa, wall, new]
            answers:
              - Yoshi likes my bed
            hints: {йоші: [Yoshi, our cat], любить: [likes, loves], ліжко: [bed]}
            word: ліжко
            newWords: [Йоші]
          # диван is met in a sentence rather than in an `assist`: purple, on a
          # dotted underline, glossed on hover. It teaches as well and it is
          # the thing that stops a teaching lesson having a skeleton.
          - type: translate
            direction: [uk, en]
            prompt: Диван старий, але Йоші його любить.
            bank: [The, sofa, is, old, but, Yoshi, likes, it, bed, new]
            answers:
              - The sofa is old, but Yoshi likes it
            hints: {диван: [sofa, couch], старий: [old], але: [but], йоші: [Yoshi, our cat], любить: [likes, loves]}
            word: диван
            newWords: [диван]
          - type: listenTap
            direction: [uk, uk]
            audio: Моє ліжко нове, а диван старий.
            bank: [Моє, ліжко, нове, а, диван, старий, велике]
            answers:
              - Моє ліжко нове, а диван старий
            meaning: My bed is new, and the sofa is old
            word: ліжко
          - type: translate
            direction: [uk, en]
            prompt: Йоші спить під ліжком.
            bank: [Yoshi, is, sleeping, under, the, bed, sofa, on]
            answers:
              - Yoshi is sleeping under the bed
              - Yoshi sleeps under the bed
            hints: {йоші: [Yoshi, our cat], спить: [is sleeping, sleeps], під: [under], ліжком: [bed, the bed]}
            word: ліжко
            newWords: [під, ліжком]
          - type: translate
            direction: [en, uk]
            prompt: My shoes are under the sofa
            bank: [Моє, взуття, під, диваном, ліжком, на]
            answers:
              - Моє взуття під диваном
              - Під диваном моє взуття
            hints: {my: [моє], shoes: [взуття], under: [під], sofa: [диваном]}
            word: диван
            newWords: [диваном]
          - type: translate
            direction: [uk, en]
            prompt: Маріо читає на дивані щовечора.
            bank: [Mario, reads, on, the, sofa, every, evening, bed, morning]
            answers:
              - Mario reads on the sofa every evening
              - Mario is reading on the sofa every evening
            hints: {маріо: [Mario], читає: [reads], дивані: [sofa, the sofa], щовечора: [every evening]}
            word: диван
            newWords: [дивані]
          - type: translate
            direction: [en, uk]
            prompt: Yoshi does not sleep on the floor, he sleeps on the sofa
            bank: [Йоші, не, спить, на, підлозі, він, спить, на, дивані, ліжку]
            answers:
              - Йоші не спить на підлозі, він спить на дивані
            hints: {yoshi: [Йоші], not: [не], sleep: [спить], floor: [підлозі], sofa: [дивані]}
            word: диван
      - xp: 10
        challenges:
          - type: match
            direction: [uk, en]
            pairs:
              - target: двері
                source: door
              - target: стіна
                source: wall
              - target: підлога
                source: floor
              - target: ліжко
                source: bed
              - target: диван
                source: sofa
          - type: translate
            direction: [en, uk]
            prompt: The walls in the bathroom are white and the floor is cold
            bank: [Стіни, у, ванній, білі, а, підлога, холодна, тепла, зелені]
            answers:
              - Стіни у ванній білі, а підлога холодна
            hints: {walls: [стіни], bathroom: [ванній], white: [білі], floor: [підлога], cold: [холодна]}
            word: ванна
            newWords: [стіни]
          - type: translate
            direction: [uk, en]
            prompt: Луїджі спить на дивані, а Маріо на ліжку.
            bank: [Luigi, sleeps, on, the, sofa, and, Mario, on, the, bed, floor]
            answers:
              - Luigi sleeps on the sofa, and Mario on the bed
            hints: {луїджі: [Luigi], спить: [sleeps], дивані: [sofa], а: [and], маріо: [Mario], ліжку: [bed, the bed]}
            word: диван
            newWords: [ліжку]
          - type: listenTap
            direction: [uk, uk]
            audio: Йоші, що під ліжком?
            bank: [Йоші, що, під, ліжком, диваном, на]
            answers:
              - Йоші, що під ліжком
            meaning: Yoshi, what is under the bed
            word: ліжко
          - type: translate
            direction: [en, uk]
            prompt: I do not want to sleep on the sofa
            bank: [Я, не, хочу, спати, на, дивані, ліжку, підлозі]
            answers:
              - Я не хочу спати на дивані
              - На дивані я не хочу спати
            hints: {not: [не], want: [хочу], sleep: [спати], sofa: [дивані]}
            word: диван
          - type: speak
            direction: [uk, uk]
            prompt: У ванній немає вікна, але є двері.
            answers:
              - У ванній немає вікна, але є двері
            hints: {ванній: [bathroom], немає: [there is no], вікна: [window], але: [but], двері: [door]}
            word: ванна
          - type: translate
            direction: [en, uk]
            prompt: The door is green and the wall is red
            bank: [Двері, зелені, а, стіна, червона, біла, підлога]
            answers:
              - Двері зелені, а стіна червона
            hints: {door: [двері], green: [зелені], wall: [стіна], red: [червона]}
            word: стіна
          - type: translate
            direction: [uk, en]
            prompt: Моє ліжко нове, але диван дуже старий.
            bank: [My, bed, is, new, but, the, sofa, is, very, old, wall]
            answers:
              - My bed is new but the sofa is very old
            hints: {ліжко: [bed], нове: [new], але: [but], диван: [sofa], дуже: [very], старий: [old]}
            word: ліжко
          - type: gapFill
            direction: [uk, uk]
            prompt: Йоші спить ___ ліжком.
            choices: [під, на, у]
            answers: [під]
            hints: {йоші: [Yoshi, our cat], спить: [sleeps], ліжком: [bed, the bed]}
            word: ліжко
          - type: listenMatch
            direction: [uk, en]
            pairs:
              - target: двері
                source: door
              - target: стіна
                source: wall
              - target: підлога
                source: floor
              - target: ванна
                source: bathroom
              - target: вікно
                source: window
  - kind: chest
  - kind: skill
    label: Filling it up
    art: star
    lessons:
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: килим
            choices: [carpet, wardrobe, bed]
            answers: [carpet]
            hints: {килим: [carpet, rug]}
            word: килим
            newWords: [килим]
          - type: translate
            direction: [uk, en]
            prompt: Килим на підлозі.
            bank: [The, carpet, is, on, the, floor, wall, wardrobe]
            answers:
              - The carpet is on the floor
            hints: {килим: [carpet], підлозі: [floor, the floor]}
            word: килим
          - type: assist
            direction: [uk, en]
            prompt: штори
            choices: [curtains, carpet, walls]
            answers: [curtains]
            hints: {штори: [curtains]}
            word: штори
            newWords: [штори]
          - type: listenTap
            direction: [uk, uk]
            audio: Штори зелені, а килим червоний.
            bank: [Штори, зелені, а, килим, червоний, білі]
            answers:
              - Штори зелені, а килим червоний
            meaning: The curtains are green, and the carpet is red
            word: штори
          - type: translate
            direction: [en, uk]
            prompt: The curtains on the window are white
            bank: [Штори, на, вікні, білі, зелені, килим]
            answers:
              - Штори на вікні білі
              - На вікні штори білі
            hints: {curtains: [штори], window: [вікні], white: [білі]}
            word: штори
          - type: assist
            direction: [uk, en]
            prompt: шафа
            choices: [wardrobe, sofa, curtains]
            answers: [wardrobe]
            hints: {шафа: [wardrobe, closet]}
            word: шафа
            newWords: [шафа]
          - type: translate
            direction: [en, uk]
            prompt: My clothes are in the wardrobe
            bank: [Мій, одяг, у, шафі, килим, на]
            answers:
              - Мій одяг у шафі
              - У шафі мій одяг
            hints: {my: [мій], clothes: [одяг], wardrobe: [шафі]}
            word: шафа
            newWords: [шафі]
          - type: translate
            direction: [uk, en]
            prompt: Шафа стара, але дуже велика.
            bank: [The, wardrobe, is, old, but, very, big, new, carpet]
            answers:
              - The wardrobe is old but very big
            hints: {шафа: [wardrobe, closet], стара: [old], але: [but], дуже: [very], велика: [big, large]}
            word: шафа
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: лампа
            choices: [lamp, mirror, carpet]
            answers: [lamp]
            hints: {лампа: [lamp, a lamp]}
            word: лампа
            newWords: [лампа]
          - type: translate
            direction: [uk, en]
            prompt: Увечері лампа на столі.
            bank: [In, the, evening, the, lamp, is, on, the, table, mirror]
            answers:
              - In the evening the lamp is on the table
            hints: {увечері: [in the evening], лампа: [lamp], столі: [table, the table]}
            word: лампа
          - type: translate
            direction: [uk, en]
            prompt: Лампа біля ліжка.
            bank: [The, lamp, is, near, the, bed, sofa, under]
            answers:
              - The lamp is near the bed
              - The lamp is by the bed
            hints: {лампа: [lamp], біля: [near, by, next to], ліжка: [bed, the bed]}
            word: лампа
            newWords: [біля, ліжка]
          - type: assist
            direction: [uk, en]
            prompt: дзеркало
            choices: [mirror, window, lamp]
            answers: [mirror]
            hints: {дзеркало: [mirror, a mirror]}
            word: дзеркало
            newWords: [дзеркало]
          - type: translate
            direction: [en, uk]
            prompt: The mirror is on the wall
            bank: [Дзеркало, на, стіні, лампа, підлозі]
            answers:
              - Дзеркало на стіні
              - На стіні дзеркало
            hints: {mirror: [дзеркало], wall: [стіні]}
            word: дзеркало
            newWords: [стіні]
          - type: listenTap
            direction: [uk, uk]
            audio: Дзеркало біля дверей.
            bank: [Дзеркало, біля, дверей, лампа, вікна]
            answers:
              - Дзеркало біля дверей
            meaning: The mirror is near the door
            word: дзеркало
            newWords: [дверей]
          - type: translate
            direction: [en, uk]
            prompt: There is a lamp near the sofa
            bank: [Біля, дивана, лампа, ліжка, на, штори]
            answers:
              - Біля дивана лампа
              - Лампа біля дивана
            hints: {lamp: [лампа], near: [біля], sofa: [дивана]}
            word: диван
            newWords: [дивана]
          # The only mirror in the flat, and the reason there is one.
          - type: translate
            direction: [uk, en]
            prompt: Маріо любить це дзеркало, і його вуса теж.
            bank: [Mario, likes, this, mirror, and, his, mustache, too, lamp, wall]
            answers:
              - Mario likes this mirror, and his mustache too
            hints: {маріо: [Mario], любить: [likes, loves], дзеркало: [mirror], вуса: [mustache], теж: [too]}
            word: дзеркало
      - xp: 10
        challenges:
          - type: assist
            direction: [uk, en]
            prompt: подушка
            choices: [pillow, blanket, towel]
            answers: [pillow]
            hints: {подушка: [pillow, a pillow]}
            word: подушка
            newWords: [подушка]
          - type: translate
            direction: [uk, en]
            prompt: Подушка на ліжку.
            bank: [The, pillow, is, on, the, bed, sofa, blanket]
            answers:
              - The pillow is on the bed
            hints: {подушка: [pillow], ліжку: [bed, the bed]}
            word: подушка
          - type: assist
            direction: [uk, en]
            prompt: ковдра
            choices: [blanket, pillow, carpet]
            answers: [blanket]
            hints: {ковдра: [blanket, a blanket]}
            word: ковдра
            newWords: [ковдра]
          - type: translate
            direction: [en, uk]
            prompt: I need a blanket please
            bank: [Мені, треба, ковдра, будь, ласка, подушка, рушник]
            answers:
              - Мені треба ковдра, будь ласка
            hints: {I: [мені], need: [треба], blanket: [ковдра], please: [будь, ласка]}
            word: ковдра
          - type: assist
            direction: [uk, en]
            prompt: рушник
            choices: [towel, blanket, curtains]
            answers: [towel]
            hints: {рушник: [towel, a towel]}
            word: рушник
            newWords: [рушник]
          - type: translate
            direction: [uk, en]
            prompt: Рушник у ванній, а ковдра на ліжку.
            bank: [The, towel, is, in, the, bathroom, and, the, blanket, is, on, the, bed, sofa]
            answers:
              - The towel is in the bathroom and the blanket is on the bed
            hints: {рушник: [towel], ванній: [bathroom], ковдра: [blanket], ліжку: [bed]}
            word: рушник
          - type: listenTap
            direction: [uk, uk]
            audio: Луїджі, мені треба рушник.
            bank: [Луїджі, мені, треба, рушник, ковдра, подушка]
            answers:
              - Луїджі, мені треба рушник
            meaning: Luigi, I need a towel
            word: рушник
          - type: translate
            direction: [en, uk]
            prompt: Can I have a pillow please
            bank: [Можна, подушку, будь, ласка, ковдру, рушник]
            answers:
