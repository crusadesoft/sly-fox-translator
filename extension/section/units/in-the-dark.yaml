title: Something in the dark
sectionLabel: SLY FOX SECTION, UNIT 2
# The character standing on this unit's path. Files live in
# assets/characters/; a unit without one falls back to the section default.
character: ghost_pumpkin.json
# The words come from the learner's own saved list -- an LLN export off a
# Ukrainian-dubbed series, where the biggest single cluster is an episode set in
# an old dark house. That cluster is the unit: темрява, льох, скрип, нагору,
# моторошний, зачиняти, гість, дух, істота, шепотіти, страшний, хоробрий.
#
# It sits on top of "Moving in", which already built the rooms. The only word
# taken from that unit rather than from Duolingo is двері -- everything else
# here is either introduced below or already on their Duolingo list, so the
# house can be furnished without teaching the furniture twice.
#
# The cast is unit 1's, and the situation is the one its word list already
# implies: a scared narrator, a brother who went down to the cellar, a ghost,
# a creak, a key, and a cat that does not care. Nothing about it costs the unit
# a word.
#
#   я       -- Луїджі, who is telling it, and who does not want to go upstairs
#   Маріо   -- the гість. Went into the льох. Has not come back up
#   Йоші    -- the cat. Sleeps in the льох, which is the joke
#
# The names are re-declared here because the new-word audit runs per file, and
# because a name met one unit ago is worth flagging purple a second time.
#
# Puck 3 keeps its own weather: daylight, family, the week, getting somewhere --
# and the household's Friday, which is the other half of unit 1's Wednesday.
pucks:
  # Puck 1 and 2 teach. Lessons 1-3 introduce; lesson 4 introduces nothing and
  # is the same words asked harder.
  - kind: skill
    label: The old house
    art: star
    lessons:
      - xp: 10
        challenges:
