<!--
  The Sly Fox section.

  This is a local extension page rather than an injection into duolingo.com/learn.
  Their path is virtualised — React mounts only the few units either side of the
  scroll position and unmounts them underneath you — so anything grafted into it
  has to fight for its place on every scroll. Here the markup is ours and stays
  put.

  Every class name below is Duolingo's own, and duolingo.css is extracted from
  their stylesheets rather than written by hand. The structure mirrors a real
  unit exactly: see build-assets/duolingo-kit/ for the harvest it came from.
-->
